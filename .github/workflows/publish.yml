name: Publish to npm
# Trusted Publishing (OIDC). Requirements per docs.npmjs.com/trusted-publishers (checked 2026-09-02):
#   npm CLI >= 11.5.1, Node >= 22.14.0, permissions id-token: write, no NODE_AUTH_TOKEN for publish,
#   GitHub-hosted runner, trusted publisher configured at npmjs.com -> package -> Settings:
#   user ShenJun93 / repo windoctor / workflow publish.yml / environment (blank).
# Provenance is generated automatically under trusted publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish --dry-run only (no upload, no auth needed)"
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: node --version && npm --version
      - run: node test/smoke.js
      - name: Check tag matches package.json version
        if: github.event_name == 'push'
        run: |
          V=$(node -p "require('./package.json').version")
          [ "refs/tags/v$V" = "$GITHUB_REF" ] || { echo "tag $GITHUB_REF != v$V"; exit 1; }
      - name: Dry run (packaging check on a throwaway version; does not exercise OIDC)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          npm version "0.0.0-dryrun.${GITHUB_RUN_ID}" --no-git-tag-version
          npm publish --dry-run --tag dryrun
          git checkout -- package.json
      - name: Publish (trusted publishing, OIDC)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm publish
